<!--
  GeoSnap Camera — single-file app (React + Tailwind, no build step).
  Requires a secure context (https:// or localhost) for Camera + Geolocation APIs to work.
  Nothing here uploads, stores, or transmits the captured photo. The only network
  request this app ever makes is an optional reverse-geocoding lookup of GPS coordinates.
-->

/* ============================== UTILITIES ============================== */

const pad2 = (n) => String(n).padStart(2, "0");

function formatDateTime(date) {
  const weekday = date.toLocaleDateString("en-US", { weekday: "long" });
  const dd = pad2(date.getDate());
  const mm = pad2(date.getMonth() + 1);
  const yyyy = date.getFullYear();
  let hours = date.getHours();
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12; if (hours === 0) hours = 12;
  const hh = pad2(hours);
  const min = pad2(date.getMinutes());
  const offsetMin = -date.getTimezoneOffset();
  const sign = offsetMin >= 0 ? "+" : "-";
  const offH = pad2(Math.floor(Math.abs(offsetMin) / 60));
  const offM = pad2(Math.abs(offsetMin) % 60);
  return `${weekday}, ${dd}/${mm}/${yyyy} ${hh}:${min} ${ampm} GMT ${sign}${offH}:${offM}`;
}

function filenameTimestamp(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}_${pad2(date.getHours())}-${pad2(date.getMinutes())}-${pad2(date.getSeconds())}`;
}

function formatCoords(lat, lng) {
  return `Lat ${lat.toFixed(6)}\u00B0  Long ${lng.toFixed(6)}\u00B0`;
}

function flagEmoji(countryCode) {
  if (!countryCode || countryCode.length !== 2) return "";
  const cc = countryCode.toUpperCase();
  try {
    const points = [...cc].map((c) => 0x1f1e6 + (c.charCodeAt(0) - 65));
    return String.fromCodePoint(...points);
  } catch (e) { return ""; }
}

// Reverse-geocode isolated in its own function. Only coordinates are sent — never the photo.
async function reverseGeocode(lat, lng, signal) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1`;
  const res = await fetch(url, { headers: { "Accept-Language": "en" }, signal });
  if (!res.ok) throw new Error("geocode-http-error");
  const data = await res.json();
  if (!data || data.error) throw new Error("geocode-empty");
  return data;
}

function buildLocationInfo(geo) {
  if (!geo || !geo.address) return null;
  const a = geo.address;
  const city = a.city || a.town || a.village || a.suburb || a.county || a.state_district || "";
  const state = a.state || a.region || "";
  const country = a.country || "";
  const countryCode = a.country_code || "";
  const primary = [city, state, country].filter(Boolean).join(", ");
  const full = geo.display_name || primary;
  return { primary: primary || "Location unavailable", full, country, countryCode };
}

function wrapCanvasText(ctx, text, maxWidth, maxLines) {
  if (!text) return [];
  const words = text.split(/\s+/);
  const lines = [];
  let current = "";
  for (const word of words) {
    const test = current ? current + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
      if (lines.length === maxLines) break;
    } else {
      current = test;
    }
  }
  if (lines.length < maxLines && current) lines.push(current);

  if (lines.length >= maxLines) {
    lines.length = Math.min(lines.length, maxLines);
    const consumed = lines.join(" ").length;
    if (consumed < text.length) {
      let last = lines[maxLines - 1] || "";
      while (last.length > 0 && ctx.measureText(last + "\u2026").width > maxWidth) {
        last = last.slice(0, -1);
      }
      lines[maxLines - 1] = last.trimEnd() + "\u2026";
    }
  }
  return lines;
}

// Draws the geotag watermark directly into the photo's pixels.
function drawWatermark(ctx, width, height, meta) {
  const scale = Math.min(2.4, Math.max(0.55, width / 1080));
  const pad = Math.max(16, Math.round(26 * scale));
  const titleSize = Math.max(17, Math.round(31 * scale));
  const addrSize = Math.max(13, Math.round(20 * scale));
  const smallSize = Math.max(12, Math.round(18 * scale));
  const lineGap = Math.max(4, Math.round(9 * scale));
  const maxTextWidth = width - pad * 2;

  const fontStack = `"Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;

  const hasLocation = !!meta.hasLocation;
  const prefix = hasLocation ? "\uD83D\uDCCD " : "\u26A0\uFE0F ";
  const titleText = prefix + (hasLocation ? (meta.primaryText || "Location unavailable") : "Location unavailable") + (meta.flag ? " " + meta.flag : "");

  const lines = [{ text: titleText, size: titleSize, weight: 800, color: "255,255,255", opacity: 1 }];

  if (hasLocation && meta.fullAddressText && meta.fullAddressText !== meta.primaryText) {
    ctx.font = `400 ${addrSize}px ${fontStack}`;
    const wrapped = wrapCanvasText(ctx, meta.fullAddressText, maxTextWidth, 2);
    wrapped.forEach((t) => lines.push({ text: t, size: addrSize, weight: 400, color: "230,230,230", opacity: 0.88 }));
  }
  if (hasLocation && meta.coordsText) {
    lines.push({ text: meta.coordsText, size: smallSize, weight: 600, color: "255,255,255", opacity: 0.82 });
  }
  lines.push({ text: meta.dateTimeText, size: smallSize, weight: 400, color: "255,255,255", opacity: 0.78 });

  let contentHeight = 0;
  lines.forEach((l, i) => { contentHeight += Math.round(l.size * 1.32); if (i < lines.length - 1) contentHeight += lineGap; });
  const panelHeight = Math.min(height * 0.42, contentHeight + pad * 2);
  const fadeHeight = panelHeight * 0.55;
  const panelTop = height - panelHeight;

  const grad = ctx.createLinearGradient(0, panelTop - fadeHeight, 0, panelTop);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(1, "rgba(0,0,0,0.5)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, panelTop - fadeHeight, width, fadeHeight);

  ctx.fillStyle = "rgba(0,0,0,0.52)";
  ctx.fillRect(0, panelTop, width, panelHeight);

  ctx.fillStyle = "rgba(255,255,255,0.14)";
  ctx.fillRect(0, panelTop, width, Math.max(1, Math.round(scale)));

  let y = panelTop + pad + lines[0].size * 0.92;
  ctx.textBaseline = "alphabetic";
  lines.forEach((l, i) => {
    ctx.font = `${l.weight} ${l.size}px ${fontStack}`;
    ctx.fillStyle = `rgba(${l.color},${l.opacity})`;
    ctx.fillText(l.text, pad, y, maxTextWidth);
    if (i < lines.length - 1) y += Math.round(l.size * 1.32) + lineGap;
  });
}

async function ensureFontsReady() {

        document.fonts.load('600 20px "Inter"'),
        document.fonts.load('800 20px "Inter"'),

      await document.fonts.ready;

  } catch (e) { /* proceed with fallback fonts */ }
}

/* ============================== APP ============================== */

function App() {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const abortRef = useRef(null);

  const [appState, setAppState] = useState("permission"); // permission | camera | processing | preview | error
  const [isRequesting, setIsRequesting] = useState(false);
  const [cameraFacing, setCameraFacing] = useState("environment");
  const [permissionDenialNote, setPermissionDenialNote] = useState(null);

  const [locationStatus, setLocationStatus] = useState("idle"); // idle | loading | ready | denied | unavailable
  const [location, setLocation] = useState(null);
  const [geo, setGeo] = useState(null);

  const [capturedPhoto, setCapturedPhoto] = useState(null);
  const [isSaving, setIsSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);
  const [flash, setFlash] = useState(false);
  const [errorInfo, setErrorInfo] = useState(null);

  const stopCameraTracks = useCallback(() => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
    if (videoRef.current) videoRef.current.srcObject = null;
  }, []);

  useEffect(() => () => { stopCameraTracks(); if (abortRef.current) abortRef.current.abort(); }, [stopCameraTracks]);

  function describeCameraError(err) {
    const name = err && err.name;
    if (name === "NotAllowedError" || name === "PermissionDeniedError") {
      return { title: "Camera access is required", message: "Please allow camera access in your browser settings and try again." };
    }
    if (name === "NotFoundError" || name === "DevicesNotFoundError") {
      return { title: "No camera found", message: "We couldn't detect a camera on this device." };
    }
    if (name === "NotReadableError" || name === "TrackStartError") {
      return { title: "Camera unavailable", message: "Your camera might be in use by another app. Close it and try again." };
    }
    if (name === "NotSupportedError" || name === "unsupported") {
      return { title: "Unsupported browser", message: "This browser doesn't support camera access. Try the latest Chrome or Safari." };
    }
    return { title: "Camera error", message: "Something went wrong starting the camera. Please try again." };
  }

  const startCamera = useCallback(async (facing) => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const e = describeCameraError({ name: "unsupported" });
      setErrorInfo({ ...e, onRetry: () => setAppState("permission") });
      setAppState("error");
      return false;
    }
    stopCameraTracks();
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing } },
          audio: false,
        });
      } catch (err) {
        if (err && err.name === "OverconstrainedError") {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } else {
          throw err;
        }
      }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play().catch(() => {});
      }
      setCameraFacing(facing);
      return true;
    } catch (err) {
      const e = describeCameraError(err);
      setErrorInfo({ ...e, onRetry: () => { setAppState("permission"); } });
      setAppState("error");
      return false;
    }
  }, [stopCameraTracks]);

  const requestLocation = useCallback(() => {
    setLocationStatus("loading");
    if (!navigator.geolocation) {
      setLocationStatus("unavailable");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, timestamp: pos.timestamp };
        setLocation(loc);
        setLocationStatus("ready");
        fetchAddress(loc.lat, loc.lng);
      },
      (err) => {
        setLocationStatus(err && err.code === 1 ? "denied" : "unavailable");
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }, []);

  async function fetchAddress(lat, lng) {
    if (abortRef.current) abortRef.current.abort();
    const controller = new AbortController();
    abortRef.current = controller;
    try {
      const data = await reverseGeocode(lat, lng, controller.signal);
      setGeo(buildLocationInfo(data));
    } catch (e) {
      setGeo(null); // silently fall back — lat/lng still shown, per spec
    }
  }

  async function handleEnable() {
    setPermissionDenialNote(null);
    setIsRequesting(true);
    const ok = await startCamera("environment");
    if (ok) {
      setAppState("camera");
      requestLocation();
    }
    setIsRequesting(false);
  }

  async function handleSwitchCamera() {
    const next = cameraFacing === "environment" ? "user" : "environment";
    await startCamera(next);
  }

  function handleExit() {
    stopCameraTracks();
    setCapturedPhoto(null);
    setLocation(null);
    setGeo(null);
    setLocationStatus("idle");
    setPermissionDenialNote(null);
    setAppState("permission");
  }

  const capturePhoto = useCallback(async () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    setAppState("processing");
    setFlash(true);
    setTimeout(() => setFlash(false), 250);

    try {
      await ensureFontsReady();
      const vw = video.videoWidth, vh = video.videoHeight;
      const canvas = document.createElement("canvas");
      canvas.width = vw;
      canvas.height = vh;
      const ctx = canvas.getContext("2d");

      if (cameraFacing === "user") {
        ctx.translate(vw, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, vw, vh);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      const now = new Date();
      const meta = {
        hasLocation: !!location,
        primaryText: geo ? geo.primary : null,
        fullAddressText: geo ? geo.full : null,
        flag: geo && geo.countryCode ? flagEmoji(geo.countryCode) : "",
        coordsText: location ? formatCoords(location.lat, location.lng) : null,
        dateTimeText: formatDateTime(now),
      };
      drawWatermark(ctx, vw, vh, meta);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      canvas.toBlob((blob) => {
        stopCameraTracks();
        setCapturedPhoto({ dataUrl, blob, timestamp: now });
        setAppState("preview");
      }, "image/jpeg", 0.92);
    } catch (err) {
      setErrorInfo({
        title: "Capture failed",
        message: "Something went wrong while processing your photo. Please try again.",
        onRetry: async () => { setAppState("camera"); await startCamera(cameraFacing); },
      });
      setAppState("error");
    }
  }, [cameraFacing, location, geo, stopCameraTracks, startCamera]);

  async function handleRetake() {
    setCapturedPhoto(null);
    setSaveError(null);
    setAppState("camera");
    await startCamera(cameraFacing);
  }

  async function handleSave() {
    if (!capturedPhoto) return;
    setSaveError(null);
    setIsSaving(true);
    try {
      const url = URL.createObjectURL(capturedPhoto.blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `geosnap_${filenameTimestamp(capturedPhoto.timestamp)}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    } catch (err) {
      setSaveError("Download failed. Please try again.");
    } finally {
      setIsSaving(false);
    }
  }

  return (
    <div className="h-[100dvh] w-full bg-neutral-950 flex items-center justify-center md:p-6">
      <div className="relative h-[100dvh] w-full max-w-[480px] bg-black overflow-hidden md:h-[92dvh] md:max-h-[900px] md:rounded-[2.25rem] md:border md:border-white/10 md:shadow-2xl">
        {appState === "permission" && (
          <PermissionScreen onEnable={handleEnable} isRequesting={isRequesting} denialNote={permissionDenialNote} />
        )}

        {(appState === "camera" || appState === "processing") && (
          <CameraScreen
            videoRef={videoRef}
            locationStatus={locationStatus}
            isProcessing={appState === "processing"}
            flash={flash}
            onCapture={capturePhoto}
            onSwitchCamera={handleSwitchCamera}
            onExit={handleExit}
            disableCapture={false}
          />
        )}

        {appState === "preview" && capturedPhoto && (
          <PreviewScreen photo={capturedPhoto} onRetake={handleRetake} onSave={handleSave} isSaving={isSaving} saveError={saveError} />
        )}

        {appState === "error" && errorInfo && (
          <ErrorScreen title={errorInfo.title} message={errorInfo.message} onRetry={errorInfo.onRetry} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
